AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  InsightHub Serverless Backend
  Minimal business analytics backend using AWS Lambda, API Gateway, Cognito, DynamoDB, and Amazon S3.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage environment identifier

  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Allowed origin domain for API Gateway and S3 CORS (e.g. https://your-amplify-domain.amplifyapp.com)

  PresignedUrlExpirySeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: S3 Presigned URL expiration duration in seconds (default 15 minutes)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        DATASETS_TABLE_NAME: !Ref DatasetsTable
        S3_BUCKET_NAME: !Ref CsvStorageBucket
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        PRESIGNED_URL_EXPIRY: !Ref PresignedUrlExpirySeconds
        ENVIRONMENT: !Ref Environment
        NODE_OPTIONS: "--enable-source-maps"

Resources:
  # ============================================================================
  # AMAZON COGNITO - USER AUTHENTICATION
  # ============================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-UserPool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      PasswordPolicy:
        MinimumLength: 8
        RequireLowercase: true
        RequireNumbers: true
        RequireSymbols: true
        RequireUppercase: true
        TemporaryPasswordValidityDays: 7
      MfaConfiguration: "OFF"
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Tags:
        - Key: Project
          Value: InsightHub
        - Key: Environment
          Value: !Ref Environment

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-WebClient"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  # ============================================================================
  # API GATEWAY REST API WITH COGNITO AUTHORIZER
  # ============================================================================
  InsightHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${FrontendOrigin}'"
        MaxAge: "'3600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization

  # ============================================================================
  # DYNAMODB TABLE - MULTI-TENANT ISOLATED METADATA STORAGE
  # Composite Key: userId (HASH) + id (RANGE) enforces tenant data isolation
  # ============================================================================
  DatasetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Datasets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: InsightHub
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # S3 BUCKET - RAW CSV STORAGE
  # ============================================================================
  CsvStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldUploads
            Status: Enabled
            ExpirationInDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
              - PUT
              - GET
            AllowedOrigins:
              - !Ref FrontendOrigin
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: InsightHub
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # CLOUDWATCH LOG GROUPS (EXPLICIT 14-DAY RETENTION FOR COST CONTROL)
  # ============================================================================
  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-HealthFunction"
      RetentionInDays: 14

  CreateDatasetFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-CreateDatasetFunction"
      RetentionInDays: 14

  ListDatasetsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ListDatasetsFunction"
      RetentionInDays: 14

  GetDatasetFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-GetDatasetFunction"
      RetentionInDays: 14

  GetPresignedUrlFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-GetPresignedUrlFunction"
      RetentionInDays: 14

  GetDatasetDownloadUrlFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-GetDatasetDownloadUrlFunction"
      RetentionInDays: 14

  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================

  # 1. Health Check (Public - Unauthenticated)
  HealthFunction:
    Type: AWS::Serverless::Function
    DependsOn: HealthFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-HealthFunction"
      CodeUri: src/
      Handler: handlers/health.handler
      Description: Simple public service health check endpoint
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref InsightHubApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  # 2. Create Dataset Metadata (Protected by Cognito Authorizer)
  CreateDatasetFunction:
    Type: AWS::Serverless::Function
    DependsOn: CreateDatasetFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-CreateDatasetFunction"
      CodeUri: src/
      Handler: handlers/createDataset.handler
      Description: Validates and stores tenant-isolated dataset metadata in DynamoDB
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DatasetsTable
      Events:
        CreateDatasetApi:
          Type: Api
          Properties:
            RestApiId: !Ref InsightHubApi
            Path: /datasets
            Method: POST

  # 3. List Datasets Metadata (Protected by Cognito Authorizer)
  ListDatasetsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListDatasetsFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ListDatasetsFunction"
      CodeUri: src/
      Handler: handlers/listDatasets.handler
      Description: Lists dataset metadata records belonging to the authenticated user
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DatasetsTable
      Events:
        ListDatasetsApi:
          Type: Api
          Properties:
            RestApiId: !Ref InsightHubApi
            Path: /datasets
            Method: GET

  # 4. Get Single Dataset Metadata (Protected by Cognito Authorizer)
  GetDatasetFunction:
    Type: AWS::Serverless::Function
    DependsOn: GetDatasetFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-GetDatasetFunction"
      CodeUri: src/
      Handler: handlers/getDataset.handler
      Description: Retrieves metadata for a single dataset by ID with tenant isolation
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DatasetsTable
      Events:
        GetDatasetApi:
          Type: Api
          Properties:
            RestApiId: !Ref InsightHubApi
            Path: /datasets/{id}
            Method: GET

  # 5. S3 Presigned POST Generator (Protected by Cognito Authorizer)
  GetPresignedUrlFunction:
    Type: AWS::Serverless::Function
    DependsOn: GetPresignedUrlFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-GetPresignedUrlFunction"
      CodeUri: src/
      Handler: handlers/getPresignedUrl.handler
      Description: Generates a secure S3 presigned POST policy with 10MB content-length-range enforcement
      Policies:
        - S3WritePolicy:
            BucketName: !Ref CsvStorageBucket
      Events:
        PresignedUrlApi:
          Type: Api
          Properties:
            RestApiId: !Ref InsightHubApi
            Path: /datasets/presigned-url
            Method: POST

  # 6. S3 Presigned GET Generator for Secure Download (Protected by Cognito Authorizer)
  GetDatasetDownloadUrlFunction:
    Type: AWS::Serverless::Function
    DependsOn: GetDatasetDownloadUrlFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-GetDatasetDownloadUrlFunction"
      CodeUri: src/
      Handler: handlers/getDatasetDownloadUrl.handler
      Description: Generates short-lived 60s presigned GET URL for downloading datasets with anti-IDOR checks
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DatasetsTable
        - S3ReadPolicy:
            BucketName: !Ref CsvStorageBucket
      Events:
        DownloadDatasetApi:
          Type: Api
          Properties:
            RestApiId: !Ref InsightHubApi
            Path: /datasets/{id}/download
            Method: GET

Outputs:
  ApiUrl:
    Description: Base REST API Gateway endpoint URL
    Value: !Sub "https://${InsightHubApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  UserPoolId:
    Description: Amazon Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Description: Amazon Cognito User Pool App Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  UserPoolArn:
    Description: Amazon Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn

  DatasetsTableName:
    Description: Name of the DynamoDB table storing dataset metadata
    Value: !Ref DatasetsTable
    Export:
      Name: !Sub "${AWS::StackName}-DatasetsTable"

  DatasetsTableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt DatasetsTable.Arn

  CsvStorageBucketName:
    Description: Name of the private S3 bucket for CSV storage
    Value: !Ref CsvStorageBucket
    Export:
      Name: !Sub "${AWS::StackName}-CsvStorageBucket"

  CsvStorageBucketArn:
    Description: ARN of the S3 storage bucket
    Value: !GetAtt CsvStorageBucket.Arn
